# Copy of the scheduled automation workflow.
# GitHub only runs workflows from .github/workflows/. To activate: open this file on GitHub,
# click the pencil (Edit), change the path to .github/workflows/update-content.yml, and commit.
name: Update news, sitemap and search index

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest small business news
        run: node scripts/update-news.mjs
      - name: Rebuild sitemap and search index
        run: node scripts/build-index.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/search-index.json sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: auto-update news, sitemap and search index"
            git pull --rebase origin main
            git push
          fi
